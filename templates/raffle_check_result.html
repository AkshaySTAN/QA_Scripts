<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raffle Check Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto Mono', monospace;
            background: linear-gradient(to right, #12002b, #3a0b6d, #220136); /* Dark purple gradient */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: auto; /* Changed from hidden to auto to allow scrolling */
            padding: 20px; /* Added padding for better content visibility */
            box-sizing: border-box; /* Ensure padding doesn't add to total width/height */
        }
        .result-container {
            background-color: rgba(0, 0, 0, 0.85); /* Dark semi-transparent black */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); /* Soft black shadow for depth */
            border: 1px solid #5e0075; /* Subtle purple border */
            backdrop-filter: blur(10px); /* Soft background blur for focus */
            width: 100%;
            max-width: 800px; /* Increased max-width for better readability of results */
            text-align: left; /* Align text to the left for readability */
        }
        .result-container h2 {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #5e0075; /* Consistent purple accent */
            padding-bottom: 10px;
        }
        pre {
            white-space: pre-wrap;       /* Since CSS 2.1 */
            white-space: -moz-pre-wrap;  /* Mozilla, since 1999 */
            white-space: -pre-wrap;      /* Opera 4-6 */
            white-space: -o-pre-wrap;    /* Opera 7 */
            word-wrap: break-word;       /* Internet Explorer 5.5+ */
            background: #111; /* Darker background for preformatted text */
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            max-height: 500px; /* Max height for the pre block */
            overflow-y: auto; /* Allow scrolling for long outputs */
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4a148c;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        a:hover {
            background-color: #6a1b9a;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <h2>Raffle Check Results</h2>
        <pre>{{ output }}</pre>
        <a href="/">Go Back</a>
    </div>
</body>
</html>
